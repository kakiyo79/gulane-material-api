services:
  - type: web
    name: gulane-material-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: X_API_KEY
        sync: false
      - key: WECOM_WEBHOOK
        sync: false
      - key: FRONTEND_URL
        sync: false
